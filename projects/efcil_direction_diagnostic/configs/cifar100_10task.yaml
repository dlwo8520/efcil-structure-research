experiment_name: cifar100_10task
data_root: /data/datasets/cifar100
output_root: ${RESEARCH_WORKSPACE}/projects/efcil_direction_diagnostic/outputs
seed: 0
num_tasks: 10
classes_per_task: 10
class_order: god_seed1993

model_name: vit_base_patch16_224.augreg_in21k
pretrained: true
image_size: 224
classifier_scale: 30.0

lora_rank: 16
lora_alpha: 16.0
lora_targets: [q, v]
gradient_probe_batches: 4

# This is a full 100-class/10-task diagnostic run, but deliberately uses a
# modest epoch budget before any later multi-seed or paper-scale extension.
epochs_per_task: 2
max_train_batches: null
batch_size: 96
eval_batch_size: 192
num_workers: 6
optimizer: adamw
learning_rate: 0.001
weight_decay: 0.01
amp: true
grad_scaler_init_scale: 256.0
grad_scaler_growth_interval: 100000
fail_on_optimizer_skip: true

subspace_images_per_class: 24
subspace_tokens_per_image: 5
subspace_topk: 3
subspace_energy_threshold: null
protected_rank_cap: 512
subspace_tolerance: 1.0e-6

small_update_ratio: 0.25
small_update_fallback_scale: 0.25
norm_match_max_scale: 10.0
log_every_steps: 10
save_every_task: true
