experiment_name: cifar100_10task
data_root: /data/datasets/cifar100
output_root: ${RESEARCH_WORKSPACE}/projects/efcil_direction_diagnostic/outputs/keeplora_efcil
seed: 0
num_tasks: 10
classes_per_task: 10
class_order: god_seed1993

model_name: vit_base_patch16_224.augreg_in21k
pretrained: true
image_size: 224
classifier_scale: 30.0

# KeepLoRA paper/official vision setting: Q/K/V/O, rank 16, alpha/r=1/16.
lora_rank: 16
lora_alpha: 1.0
lora_targets: [q, k, v, o]
gradient_probe_batches: 1
gradient_probe_amp: false

# Original KeepLoRA uses ten epochs for the main MTIL tasks.
epochs_per_task: 10
max_train_batches: null
batch_size: 96
eval_batch_size: 192
centroid_images_per_class: null
num_workers: 6
learning_rate: 0.001
weight_decay: 0.01
amp: true
grad_scaler_init_scale: 256.0
grad_scaler_growth_interval: 100000
fail_on_optimizer_skip: true

# Official vision thresholds.
epsilon_w: 0.85
epsilon_f: 0.99
feature_images_per_class: null
feature_batch_size: 16
max_feature_batches: null
subspace_tolerance: 1.0e-6

log_every_steps: 25
save_every_task: true

