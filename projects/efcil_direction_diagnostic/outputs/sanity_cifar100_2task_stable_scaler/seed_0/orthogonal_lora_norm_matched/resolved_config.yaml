experiment_name: sanity_cifar100_2task_stable_scaler
data_root: ${RESEARCH_WORKSPACE}/data
output_root: ${RESEARCH_WORKSPACE}/projects/efcil_direction_diagnostic/outputs
seed: 0
num_tasks: 2
classes_per_task: 10
class_order: god_seed1993
model_name: vit_base_patch16_224.augreg_in21k
pretrained: true
image_size: 224
classifier_scale: 30.0
lora_rank: 16
lora_alpha: 16.0
lora_targets:
- q
- v
gradient_probe_batches: 1
epochs_per_task: 1
max_train_batches: 4
batch_size: 64
eval_batch_size: 128
num_workers: 4
optimizer: adamw
learning_rate: 0.001
weight_decay: 0.01
amp: true
grad_scaler_init_scale: 256.0
grad_scaler_growth_interval: 100000
fail_on_optimizer_skip: true
subspace_images_per_class: 8
subspace_tokens_per_image: 3
subspace_topk: 2
subspace_energy_threshold: null
protected_rank_cap: 256
subspace_tolerance: 1.0e-06
small_update_fallback_scale: 0.25
norm_match_max_scale: 10.0
log_every_steps: 1
save_every_task: true
